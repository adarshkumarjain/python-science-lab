<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Science Lab 🔬</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .locked-icon { opacity: 0.5; filter: grayscale(1); }
    .reset-btn { font-size: 0.8rem; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.75rem; cursor: pointer; }
    .reset-btn:hover { color: var(--accent-red); border-color: var(--accent-red); }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="index-nav">
    <div class="logo">
      <div class="logo-icon">🔬</div>
      Python Science Lab
    </div>
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <button class="reset-btn" onclick="resetProgress()">🔄 Reset Progress</button>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero-section">
    <span class="hero-emoji">🚀</span>
    <h1>Welcome to Python Science Lab!</h1>
    <p>Learn Python through exciting science and math experiments. Code your way through 20 chapters and become a Python Scientist!</p>
    <a href="#chapters" class="btn btn-primary btn-lg">🔬 Start Exploring</a>
  </section>

  <!-- PROGRESS OVERVIEW -->
  <div class="progress-overview">
    <div class="progress-overview-card">
      <div class="progress-numbers">
        <div class="big-num" id="completed-count">0</div>
        <div class="big-label">of 20 done</div>
      </div>
      <div class="progress-bar-section">
        <h4>Your Python Journey</h4>
        <div class="progress-bar-wrap" style="margin-bottom:0.5rem;">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div style="font-size:0.85rem; color:var(--text-muted);" id="progress-label">Complete chapters to unlock more!</div>
      </div>
      <div style="font-size:2.5rem; line-height:1;" id="trophy-icon">🌱</div>
    </div>
  </div>

  <!-- CHAPTERS GRID -->
  <section class="chapters-section" id="chapters">
    <h2 style="color:var(--text-primary)">📚 Your 20 Chapters</h2>
    <div class="chapters-grid" id="chapters-grid">
      <!-- Generated by JS -->
    </div>
  </section>

  <script src="js/chapters.js"></script>
  <script>
    // ---- Progress helpers ----
    function loadProgress() {
      try { return JSON.parse(localStorage.getItem('pythonlab_progress') || '{}'); }
      catch { return {}; }
    }
    function isUnlocked(id, progress) {
      if (id === 1) return true;
      return progress[id - 1] === 'completed';
    }
    function resetProgress() {
      if (confirm('Reset all your progress? (This cannot be undone)')) {
        localStorage.removeItem('pythonlab_progress');
        location.reload();
      }
    }

    // ---- Render chapters ----
    function renderChapters() {
      const progress = loadProgress();
      const grid = document.getElementById('chapters-grid');
      let completedCount = 0;

      grid.innerHTML = CHAPTERS.map(ch => {
        const unlocked = isUnlocked(ch.id, progress);
        const status = progress[ch.id];
        const isCompleted = status === 'completed';
        if (isCompleted) completedCount++;

        const statusLabel = isCompleted
          ? '<span class="badge badge-green">✅ Done</span>'
          : unlocked
            ? '<span class="badge badge-cyan">▶ Start</span>'
            : '<span class="badge badge-locked">🔒 Locked</span>';

        const stepsDone = isCompleted ? 4 : (status ? parseInt(status) || 0 : 0);
        const stepsBar = [0,1,2,3].map(i =>
          `<span style="display:inline-block;width:18px;height:5px;border-radius:3px;background:${i < stepsDone ? (isCompleted ? 'var(--accent-green)' : 'var(--accent-cyan)') : 'var(--border)'}"></span>`
        ).join('');

        return `
          <a href="chapter.html?id=${ch.id}" class="chapter-card ${!unlocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''}"
             style="--card-color:${ch.color}" ${!unlocked ? 'onclick="return false;"' : ''}>
            <div class="chapter-card-top">
              <span class="${!unlocked ? 'locked-icon' : ''}" style="font-size:2.2rem">${ch.emoji}</span>
              <span class="chapter-num">Chapter ${ch.id}</span>
            </div>
            <h3>${ch.title}</h3>
            <p>${ch.tagline}</p>
            <div class="chapter-card-footer">
              <div style="display:flex;gap:3px;align-items:center">${stepsBar}</div>
              ${statusLabel}
            </div>
          </a>`;
      }).join('');

      // Update progress display
      document.getElementById('completed-count').textContent = completedCount;
      const pct = Math.round((completedCount / 20) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';

      const labels = ['Complete chapters to unlock more!', 'Great start! Keep going! 🌱', 'You\'re on a roll! 🔥', 'Halfway there! ⚗️', 'Amazing work! Almost there! 🚀', 'Python Scientist! 🏆'];
      const labelIdx = Math.min(Math.floor(completedCount / 4), labels.length - 1);
      document.getElementById('progress-label').textContent = completedCount + ' of 20 chapters completed — ' + labels[labelIdx];

      const trophies = ['🌱','🌿','⭐','🌟','🏅','🏆'];
      document.getElementById('trophy-icon').textContent = trophies[labelIdx];
    }

    renderChapters();
  </script>
  <!-- narrator and qa not needed on the home page -->
</body>
</html>
